<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neovim (wasm) — grid UI</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    background: #000; color: #dcdcdc;
    overflow: hidden;
  }
  /* The canvas renderer (neovim-ui.js + grid-renderer.js) paints the whole
     grid; the element just needs to fill the viewport. mount_into sizes the
     backing store to this CSS box x devicePixelRatio (crisp on HiDPI) and its
     ResizeObserver reflows the grid (try_resize -> grid_resize) whenever the
     browser window changes size. The cursor is painted by the renderer as a
     reverse-video block - no CSS involved. */
  #screen {
    display: block;
    background: #000;
    box-sizing: border-box;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    outline: none;
  }

  /* Toast notifications: status updates stack in the bottom-right corner and
     fade out on their own (driven by app.js's toast()). */
  #toasts {
    position: fixed;
    right: 1rem; bottom: 1rem;
    display: flex; flex-direction: column; align-items: flex-end; gap: .5rem;
    z-index: 10;
    pointer-events: none;
  }
  #toasts .toast {
    max-width: min(28rem, 90vw);
    font-size: .8rem; line-height: 1.3;
    padding: .5rem .75rem;
    border-radius: 6px;
    background: rgba(40, 40, 40, .95);
    color: #e8e8e8;
    border: 1px solid #555;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    opacity: 0;
    transform: translateY(.5rem);
    transition: opacity .2s ease, transform .2s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #toasts .toast.show { opacity: 1; transform: translateY(0); }
  #toasts .toast.error { background: rgba(90, 30, 30, .95); border-color: #a55; }
</style>
</head>
<body>
  <canvas id="screen" aria-label="Neovim screen"></canvas>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Layered: MessagePack global, then the canvas grid renderer, then the
       core, then the Neovim UI layer, then the page glue that composes them.
       grid-renderer.js must precede neovim-ui.js (mount_into reads the
       GridRenderer global, like neovim.js reads the MessagePack global). -->
  <script src="msgpack.min.js"></script>
  <script src="grid-renderer.js"></script>
  <script src="neovim.js"></script>
  <script src="neovim-ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
