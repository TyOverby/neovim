<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neovim (wasm) — grid UI</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 0;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    background: #000; color: #dcdcdc;
    overflow: hidden;
  }
  #screen {
    margin: 0;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0;
    white-space: pre;
    background: #000;
    color: #d4d4d4;
    padding: 8px;
    /* Fill the whole viewport; mount_into's ResizeObserver reflows the grid
       (try_resize -> grid_resize) whenever the browser window changes size. */
    box-sizing: border-box;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    outline: none;
    tab-size: 8;
  }
  /* Cursor: a solid block. render() sets inline bg/fg (swapped from the cell)
     so it stays visible over a coloured cell; this outline is a fallback for the
     default-colour case where no inline background is emitted. */
  #screen .cursor { outline: 1px solid #d4d4d4; outline-offset: -1px; }

  /* Toast notifications: status updates stack in the bottom-right corner and
     fade out on their own (driven by app.js's toast()). */
  #toasts {
    position: fixed;
    right: 1rem; bottom: 1rem;
    display: flex; flex-direction: column; align-items: flex-end; gap: .5rem;
    z-index: 10;
    pointer-events: none;
  }
  #toasts .toast {
    max-width: min(28rem, 90vw);
    font-size: .8rem; line-height: 1.3;
    padding: .5rem .75rem;
    border-radius: 6px;
    background: rgba(40, 40, 40, .95);
    color: #e8e8e8;
    border: 1px solid #555;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
    opacity: 0;
    transform: translateY(.5rem);
    transition: opacity .2s ease, transform .2s ease;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #toasts .toast.show { opacity: 1; transform: translateY(0); }
  #toasts .toast.error { background: rgba(90, 30, 30, .95); border-color: #a55; }
</style>
</head>
<body>
  <pre id="screen" aria-label="Neovim screen"></pre>
  <div id="toasts" aria-live="polite" aria-atomic="false"></div>

  <!-- Standalone app: when this page is served BY `rvim --proxy`,
       /proxy-config.js sets window.__NVIM_PROXY = { url, mount, root } and app.js
       opts into the IO proxy (real FS / :! / :terminal / LSP on the server). The
       plain static demo (serve.js) does NOT serve this file -> it 404s, the global
       stays undefined, and app.js behaves exactly as the no-proxy demo. onerror
       swallows that 404 so the static demo's console stays clean. -->
  <script src="proxy-config.js" onerror="/* no proxy config (static demo): app.js runs no-proxy */"></script>

  <!-- Layered: MessagePack global, then the core, then the renderer, then the
       page glue that composes them. -->
  <script src="msgpack.min.js"></script>
  <script src="neovim.js"></script>
  <script src="neovim-ui.js"></script>
  <script src="neovim-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
