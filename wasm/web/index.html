<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neovim (wasm) — grid UI</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 1rem;
    font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
    background: #1e1e1e; color: #dcdcdc;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .5rem; }
  #status { font-size: .8rem; opacity: .7; margin-bottom: .5rem; min-height: 1.2em; }
  #screen {
    margin: 0;
    font-family: inherit;
    font-size: 16px;
    line-height: 1.2;
    letter-spacing: 0;
    white-space: pre;
    background: #000;
    color: #d4d4d4;
    padding: 8px;
    border: 1px solid #444;
    /* A real, resizable box so mount_into auto-sizes the grid to fill it and a
       drag of the resize handle reflows the grid (try_resize -> grid_resize). */
    box-sizing: border-box;
    width: 80ch;
    height: 24em;
    max-width: 100%;
    overflow: hidden;
    resize: both;
    outline: none;
    tab-size: 8;
  }
  /* Cursor: a solid block. render() sets inline bg/fg (swapped from the cell)
     so it stays visible over a coloured cell; this outline is a fallback for the
     default-colour case where no inline background is emitted. */
  #screen .cursor { outline: 1px solid #d4d4d4; outline-offset: -1px; }
  .hint { font-size: .75rem; opacity: .55; margin-top: .5rem; }
</style>
</head>
<body>
  <h1>Neovim → WebAssembly — character-grid UI</h1>
  <div id="status">loading…</div>
  <pre id="screen" aria-label="Neovim screen"></pre>
  <div class="hint">
    Engine (<code>nvim --embed</code>) runs in a Web Worker; this page is a pure-JS
    msgpack-RPC client rendering the <code>ext_linegrid</code> grid. Click the grid, then type.
    Drag the bottom-right corner (or resize the window) to reflow the grid.
  </div>

  <!-- Stage 4 standalone app: when this page is served BY wasm/server/server.js,
       /proxy-config.js sets window.__NVIM_PROXY = { url, mount, root } and app.js
       opts into the IO proxy (real FS / :! / :terminal / LSP on the server). The
       plain static demo (serve.js) does NOT serve this file -> it 404s, the global
       stays undefined, and app.js behaves exactly as the no-proxy demo. onerror
       swallows that 404 so the static demo's console stays clean. -->
  <script src="proxy-config.js" onerror="/* no proxy config (static demo): app.js runs no-proxy */"></script>

  <!-- Layered: MessagePack global, then the core, then the renderer, then the
       page glue that composes them. -->
  <script src="msgpack.min.js"></script>
  <script src="neovim.js"></script>
  <script src="neovim-ui.js"></script>
  <script src="neovim-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
